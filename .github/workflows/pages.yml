# Publishes web/ (UVK1-RxJa Tools, a fork of UV Studio) to GitHub Pages as
# tools/, with the firmware (f4hwn.rxja.bin) and Japanese data (ja_res.bin) of
# every published rxja-v* release bundled under tools/firmware/<tag>/ and
# listed in tools/firmware/index.json. Release assets are bundled because GitHub serves them
# without CORS headers, so the page cannot fetch them directly.
#
# The wiki is converted to the top page and docs/ (with sitemap.xml) by
# tools/docs-site/build.py, because GitHub marks wiki pages noindex and they
# never appear in search results. The wiki stays the source of the text.
# Old links to the tools at the top (/#flash and so on) are forwarded to
# tools/ by the top page.
#
# Triggers:
#   - push to main touching web/, tools/docs-site/ or this file
#   - a release being published, edited or deleted
#   - a wiki page being created or edited (gollum)
#   - by hand: Actions > Pages > Run workflow, or
#     `gh workflow run pages.yml -R dosei/uvk1-japanese`
#
# The github-pages environment only accepts deployments from main, and a
# release event runs on the tag ref, so a release event does not build here:
# the `redispatch` job re-runs this workflow on main via workflow_dispatch
# (which GITHUB_TOKEN is allowed to trigger). Note that a release event uses
# the workflow file of the tagged commit, so tags made before this file existed
# do not trigger it; run it by hand in that case.

name: Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'tools/docs-site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [ published, edited, deleted ]
  gollum:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run Pages on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml -R "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}"
          echo "Release ${{ github.event.release.tag_name }} was ${{ github.event.action }}; dispatched Pages on the default branch."

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy web/
        run: |
          set -euo pipefail
          mkdir -p _site/tools
          cp -r web/. _site/tools/

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: _wiki
          fetch-depth: 0

      - name: Build docs/ and sitemap.xml from the wiki
        run: |
          set -euo pipefail
          python3 -m venv _venv
          _venv/bin/pip install -q -r tools/docs-site/requirements.txt
          _venv/bin/python tools/docs-site/build.py _wiki _site

      - name: Bundle RxJa releases
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: _site/tools
          WORK: _work
        run: |
          set -euo pipefail
          mkdir -p "$SITE/firmware" "$WORK"
          bins="f4hwn.rxja.bin ja_res.bin"

          gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 \
            --json tagName,isDraft,isPrerelease,publishedAt,name \
            --jq '[.[] | select(.isDraft | not) | select(.tagName | startswith("rxja-v"))]' \
            > "$WORK/releases.json"
          : > "$WORK/kept.txt"

          for tag in $(jq -r '.[].tagName' "$WORK/releases.json"); do
            echo "::group::$tag"
            assets=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            missing=""
            for f in $bins; do
              grep -qxF "$f" <<<"$assets" || missing="$missing $f"
            done
            if [ -n "$missing" ]; then
              echo "::warning::$tag: skipped, release has no$missing"
              echo "::endgroup::"
              continue
            fi
            if ! grep -qxF SHA256SUMS <<<"$assets"; then
              echo "::error::$tag: release has no SHA256SUMS"
              exit 1
            fi

            dir="$SITE/firmware/$tag"
            mkdir -p "$dir"
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "$dir" \
              -p f4hwn.rxja.bin -p ja_res.bin -p SHA256SUMS
            for f in $bins; do
              n=$(awk -v f="$f" '{ n = $2; sub(/^\*/, "", n); if (n == f) c++ } END { print c + 0 }' "$dir/SHA256SUMS")
              if [ "$n" -ne 1 ]; then
                echo "::error::$tag: SHA256SUMS lists $f $n times (expected once)"
                exit 1
              fi
            done
            (cd "$dir" && sha256sum -c --ignore-missing SHA256SUMS) || {
              echo "::error::$tag: checksum mismatch"
              exit 1
            }
            echo "$tag" >> "$WORK/kept.txt"
            echo "::endgroup::"
          done

          python3 - <<'EOF'
          import datetime, hashlib, json, os

          site, work = os.environ["SITE"], os.environ["WORK"]
          with open(os.path.join(work, "releases.json")) as f:
              meta = {r["tagName"]: r for r in json.load(f)}
          with open(os.path.join(work, "kept.txt")) as f:
              kept = [line.strip() for line in f if line.strip()]

          def entry(tag, name):
              path = f"firmware/{tag}/{name}"
              with open(os.path.join(site, path), "rb") as f:
                  data = f.read()
              return {"path": path, "size": len(data),
                      "sha256": hashlib.sha256(data).hexdigest()}

          releases = []
          for tag in kept:
              r = meta[tag]
              releases.append({
                  "tag": tag,
                  "version": tag[len("rxja-v"):],
                  "name": r.get("name") or tag,
                  "prerelease": bool(r.get("isPrerelease")),
                  "published_at": r.get("publishedAt") or "",
                  "firmware": entry(tag, "f4hwn.rxja.bin"),
                  "ja": entry(tag, "ja_res.bin"),
              })
          releases.sort(key=lambda r: r["published_at"], reverse=True)

          index = {
              "generated": datetime.datetime.now(datetime.timezone.utc)
                           .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "releases": releases,
          }
          with open(os.path.join(site, "firmware", "index.json"), "w", encoding="utf-8") as f:
              json.dump(index, f, ensure_ascii=False, indent=2)
              f.write("\n")
          EOF
          cat "$SITE/firmware/index.json"

      - name: Check index.json
        run: |
          set -euo pipefail
          n=$(jq '.releases | length' _site/tools/firmware/index.json)
          echo "releases bundled: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::firmware/index.json has no releases"
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
